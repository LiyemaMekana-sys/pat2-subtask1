#include <iostream> 

#include <string> 

#include <cctype> 

 

using namespace std; 

 

// Morse code array for letters A-Z 

string morseCode[] = 

{ 

    ".-", "-...", "-.-.", "-..", ".", "..-.", "--.", "....", 

    "..", ".---", "-.-", ".-..", "--", "-.", "---", ".--.", 

    "--.-", ".-.", "...", "-", "..-", "...-", ".--", "-..-", 

    "-.--", "--.." 

}; 

 

int main() 

{ 

    string message; 

    string fullMorse = ""; 

 

    cout << "======================================" << endl; 

    cout << "      MORSE CODE TRANSLATOR" << endl; 

    cout << "======================================" << endl; 

 

    cout << "Enter an English message: "; 

    getline(cin, message); 

 

    cout << "\nLetter-by-Letter Translation\n"; 

    cout << "-----------------------------" << endl; 

 

    for (char ch : message) 

    { 

        // Convert lowercase letters to uppercase 

        ch = toupper(ch); 

 

        // Process only letters A-Z 

        if (ch >= 'A' && ch <= 'Z') 

        { 

            int index = ch - 'A'; 

            string morse = morseCode[index]; 

 

            cout << ch << " : " << morse << endl; 

 

            if (!fullMorse.empty()) 

            { 

                fullMorse += "   "; // Three spaces between letters 

            } 

 

            fullMorse += morse; 

        } 

    } 

 

    cout << "\n-----------------------------" << endl; 

    cout << "Full Morse Code Message:" << endl; 

    cout << fullMorse << endl; 

 

    return 0; 

} 
